function AdminVendasPage({ storeVendas, showToast }) {
    const todayStr = new Date().toISOString().split('T')[0];
    const [mode, setMode] = useState('day');
    const [refDate, setRefDate] = useState(todayStr);
    const [refMonth, setRefMonth] = useState(todayStr.slice(0, 7));
    const [customStart, setCustomStart] = useState(todayStr);
    const [customEnd, setCustomEnd] = useState(todayStr);
    const [storeFilter, setStoreFilter] = useState('all');
    const [vendFilter, setVendFilter] = useState('all');
    const [searchCliente, setSearchCliente] = useState('');
    const [printVenda, setPrintVenda] = useState(null);

    const handlePrintVenda = (venda) => {
        setPrintVenda(venda);
        setTimeout(() => { window.print(); setTimeout(() => setPrintVenda(null), 500); }, 300);
    };

    const range = useMemo(() => {
        if (mode === 'day') return [refDate, refDate];
        if (mode === 'week') {
            const d = parseDateKey(refDate);
            if (!d) return [refDate, refDate];
            const start = new Date(d); start.setDate(d.getDate() - d.getDay());
            const end = new Date(start); end.setDate(start.getDate() + 6);
            return [dateKey(start), dateKey(end)];
        }
        if (mode === 'month') return [refMonth + '-01', refMonth + '-31'];
        return [customStart, customEnd];
    }, [mode, refDate, refMonth, customStart, customEnd]);

    const inPeriod = useMemo(() => {
        return Object.values(storeVendas).flat()
            .filter(v => v.date && v.date >= range[0] && v.date <= range[1] && (storeFilter === 'all' || v.storeId === storeFilter))
            .sort((a, b) => (b.date > a.date ? 1 : -1));
    }, [storeVendas, range, storeFilter]);

    const vendedorasNoPeriodo = useMemo(() => [...new Set(inPeriod.map(v => (v.vendedora || '').toUpperCase()).filter(Boolean))].sort(), [inPeriod]);
    const filtered = useMemo(() => {
        let r = vendFilter === 'all' ? inPeriod : inPeriod.filter(v => (v.vendedora || '').toUpperCase() === vendFilter);
        const s = searchCliente.trim().toLowerCase();
        if (s) {
            const sDigits = s.replace(/\D/g, '');
            r = r.filter(v =>
                (v.customerName || '').toLowerCase().includes(s) ||
                (sDigits && (v.customerCPF || '').replace(/\D/g, '').includes(sDigits)) ||
                (v.ticket || '').toLowerCase().includes(s)
            );
        }
        return r;
    }, [inPeriod, vendFilter, searchCliente]);

    const totalVendido = filtered.reduce((s, v) => s + num(v.total), 0);
    const totalItens = filtered.reduce((s, v) => s + num(v.itensCount), 0);
    const ticketMedio = filtered.length > 0 ? totalVendido / filtered.length : 0;

    const rankingVend = useMemo(() => {
        const map = {};
        filtered.forEach(v => {
            const k = (v.vendedora || '').toUpperCase();
            if (!k) return;
            if (!map[k]) map[k] = { nome: k, valor: 0, vendas: 0, itens: 0, lojas: {} };
            map[k].valor += num(v.total);
            map[k].vendas += 1;
            map[k].itens += num(v.itensCount);
            map[k].lojas[v.storeName] = true;
        });
        return Object.values(map).sort((a, b) => b.valor - a.valor);
    }, [filtered]);

    const porLoja = useMemo(() => {
        return STORES.map(s => {
            const vs = filtered.filter(v => v.storeId === s.id);
            return { id: s.id, name: s.name, valor: vs.reduce((t, v) => t + num(v.total), 0), vendas: vs.length };
        }).filter(l => l.vendas > 0).sort((a, b) => b.valor - a.valor);
    }, [filtered]);

    const handleExportExcel = () => {
        if (!filtered.length) { alert('Nao ha vendas no periodo'); return; }
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(filtered.map(v => ({
            'Data': v.date, 'Loja': v.storeName, 'Ticket': v.ticket || '', 'Cliente': v.customerName || '', 'CPF': v.customerCPF || '', 'Vendedora': v.vendedora,
            'Forma Pagamento': v.formaPagamento, 'Qtd Itens': num(v.itensCount), 'Total': num(v.total),
            'Produtos': (v.items || []).map(i => i.qty + 'x ' + i.product).join(' | ')
        }))), 'Vendas');
        const itensRows = filtered.flatMap(v => (v.items || []).map(i => ({
            'Data': v.date, 'Loja': v.storeName, 'Ticket': v.ticket || '', 'Vendedora': v.vendedora,
            'Codigo Barras': i.barcode || '', 'Produto': i.product, 'Qtd': i.qty, 'Valor Unit': i.valorUnit, 'Subtotal': i.subtotal
        })));
        if (itensRows.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(itensRows), 'Itens');
        if (rankingVend.length) {
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rankingVend.map((r, i) => ({
                'Posicao': i + 1, 'Vendedora': r.nome, 'Valor': r.valor, 'Nº Vendas': r.vendas,
                'Itens': r.itens, 'Ticket Medio': r.vendas > 0 ? r.valor / r.vendas : 0, 'Lojas': Object.keys(r.lojas).join(', ')
            }))), 'Ranking Vendedoras');
        }
        if (porLoja.length) {
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(porLoja.map(l => ({
                'Loja': l.name, 'Nº Vendas': l.vendas, 'Total': l.valor
            }))), 'Por Loja');
        }
        XLSX.writeFile(wb, 'vendas-' + range[0] + '-a-' + range[1] + '.xlsx');
    };

    return (
        <div>
            {printVenda && <PrintVendaCupom venda={printVenda} storeName={printVenda.storeName} />}
            <div className="header">
                <h1 className="page-title">🛒 Vendas — Consolidado</h1>
                <p className="page-subtitle">Geral, por loja e por vendedora • tempo real</p>
            </div>
            <div className="card">
                <div className="admin-cal-filter-bar">
                    <span style={{ fontSize:'0.85rem', color:'var(--text-secondary)', fontWeight:'600' }}>Período:</span>
                    <button className={`admin-cal-filter-btn ${mode === 'day' ? 'active' : ''}`} onClick={() => setMode('day')}>Dia</button>
                    <button className={`admin-cal-filter-btn ${mode === 'week' ? 'active' : ''}`} onClick={() => setMode('week')}>Semana</button>
                    <button className={`admin-cal-filter-btn ${mode === 'month' ? 'active' : ''}`} onClick={() => setMode('month')}>Mês</button>
                    <button className={`admin-cal-filter-btn ${mode === 'custom' ? 'active' : ''}`} onClick={() => setMode('custom')}>Personalizado</button>
                </div>
                <div className="form-row">
                    {(mode === 'day' || mode === 'week') && (
                        <div className="form-group"><label className="form-label">{mode === 'day' ? 'Data' : 'Data de referência (semana Dom-Sáb)'}</label><input type="date" className="form-input" value={refDate} onChange={e => setRefDate(e.target.value)} /></div>
                    )}
                    {mode === 'month' && (
                        <div className="form-group"><label className="form-label">Mês</label><input type="month" className="form-input" value={refMonth} onChange={e => setRefMonth(e.target.value)} /></div>
                    )}
                    {mode === 'custom' && (
                        <>
                            <div className="form-group"><label className="form-label">De</label><input type="date" className="form-input" value={customStart} onChange={e => setCustomStart(e.target.value)} /></div>
                            <div className="form-group"><label className="form-label">Até</label><input type="date" className="form-input" value={customEnd} onChange={e => setCustomEnd(e.target.value)} /></div>
                        </>
                    )}
                    <div className="form-group">
                        <label className="form-label">Loja</label>
                        <select className="form-select" value={storeFilter} onChange={e => setStoreFilter(e.target.value)}>
                            <option value="all">🏪 Todas as Lojas</option>
                            {STORES.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                        </select>
                    </div>
                    <div className="form-group">
                        <label className="form-label">Vendedora</label>
                        <select className="form-select" value={vendFilter} onChange={e => setVendFilter(e.target.value)}>
                            <option value="all">👩‍💼 Todas</option>
                            {vendedorasNoPeriodo.map(v => <option key={v} value={v}>{v}</option>)}
                        </select>
                    </div>
                    <div className="form-group">
                        <label className="form-label">Localizar Cliente</label>
                        <input className="form-input" value={searchCliente} onChange={e => setSearchCliente(e.target.value)} placeholder="Nome, CPF ou ticket" />
                    </div>
                </div>
                <div className="action-buttons" style={{ marginBottom: 0 }}>
                    <button className="btn btn-success" onClick={handleExportExcel}>📥 Exportar Excel</button>
                </div>
            </div>
            <div className="stats-grid">
                <div className="stat-card"><span className="stat-icon">💰</span><span className="stat-value" style={{ fontSize:'1.6rem' }}>{fmt(totalVendido)}</span><span className="stat-label">Total Vendido</span></div>
                <div className="stat-card"><span className="stat-icon">🛒</span><span className="stat-value" style={{ fontSize:'1.6rem' }}>{filtered.length}</span><span className="stat-label">Nº de Vendas</span></div>
                <div className="stat-card"><span className="stat-icon">📦</span><span className="stat-value" style={{ fontSize:'1.6rem' }}>{totalItens}</span><span className="stat-label">Itens Vendidos</span></div>
                <div className="stat-card"><span className="stat-icon">🎫</span><span className="stat-value" style={{ fontSize:'1.6rem' }}>{fmt(ticketMedio)}</span><span className="stat-label">Ticket Médio</span></div>
            </div>
            {rankingVend.length > 0 && (
                <div className="card">
                    <h2 className="card-title">🏆 Por Vendedora</h2>
                    <div className="table-container">
                        <table className="table">
                            <thead><tr><th>#</th><th>Vendedora</th><th>Valor</th><th>Nº Vendas</th><th>Itens</th><th>Ticket Médio</th><th>Lojas</th></tr></thead>
                            <tbody>
                                {rankingVend.map((r, i) => (
                                    <tr key={r.nome}>
                                        <td style={{ fontWeight:'800' }}>{i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1)}</td>
                                        <td style={{ fontWeight:'700' }}>{r.nome}</td>
                                        <td style={{ color:'var(--success)', fontWeight:'700' }}>{fmt(r.valor)}</td>
                                        <td>{r.vendas}</td>
                                        <td>{r.itens}</td>
                                        <td style={{ color:'var(--accent)' }}>{fmt(r.valor / r.vendas)}</td>
                                        <td style={{ fontSize:'0.85rem', color:'var(--text-secondary)' }}>{Object.keys(r.lojas).join(', ')}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            )}
            {porLoja.length > 0 && (
                <div className="card">
                    <h2 className="card-title">🏪 Por Loja</h2>
                    <div className="table-container">
                        <table className="table">
                            <thead><tr><th>Loja</th><th>Nº Vendas</th><th>Total Vendido</th></tr></thead>
                            <tbody>
                                {porLoja.map(l => (
                                    <tr key={l.id}>
                                        <td style={{ fontWeight:'700' }}>{l.name}</td>
                                        <td>{l.vendas}</td>
                                        <td style={{ color:'var(--success)', fontWeight:'700' }}>{fmt(l.valor)}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            )}
            <div className="card">
                <h2 className="card-title">📋 Vendas Detalhadas</h2>
                {filtered.length > 0 ? (
                    <div className="table-container">
                        <table className="table">
                            <thead><tr><th>Data</th><th>Loja</th><th>Ticket</th><th>Cliente</th><th>CPF</th><th>Vendedora</th><th>Pagamento</th><th>Itens</th><th>Total</th><th></th></tr></thead>
                            <tbody>
                                {filtered.map(v => (
                                    <tr key={v.storeId + '-' + v.id}>
                                        <td>{parseDateKey(v.date) ? parseDateKey(v.date).toLocaleDateString('pt-BR') : v.date}</td>
                                        <td style={{ fontSize:'0.85rem' }}>{v.storeName}</td>
                                        <td style={{ fontWeight:'700' }}>{v.ticket || '-'}</td>
                                        <td>{v.customerName || '-'}</td>
                                        <td style={{ fontSize:'0.85rem', color:'var(--text-secondary)' }}>{v.customerCPF || '-'}</td>
                                        <td>{v.vendedora}</td>
                                        <td>{v.formaPagamento}</td>
                                        <td style={{ fontSize:'0.85rem', color:'var(--text-secondary)' }}>{(v.items || []).map(i => i.qty + 'x ' + i.product).join(', ')}</td>
                                        <td style={{ fontWeight:'700', color:'var(--success)' }}>{fmt(v.total)}</td>
                                        <td><button className="btn btn-secondary btn-small" onClick={() => handlePrintVenda(v)}>🖨️</button></td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                ) : (
                    <div className="empty-state"><div className="empty-state-icon">🛒</div><p>Nenhuma venda no período selecionado</p></div>
                )}
            </div>
        </div>
    );
}

function AdminSeedPage({ showToast }) {
    const [seeding, setSeeding] = useState(false);
    const [done, setDone] = useState([]);

    const handleSeed = async () => {
        if (!confirm('Isso vai SUBSTITUIR o estoque de TODAS as filiais. Confirmar?')) return;
        setSeeding(true); setDone([]);
        try {
            const results = await window.TrocaDB.seedInventoryAllStores(STORES.map(s => s.id), INITIAL_INVENTORY);
            setDone(results);
            showToast('Estoque sincronizado em todas as filiais! ✅');
        } catch(e) {
            console.error(e);
            showToast('Erro ao sincronizar estoque', 'error');
        } finally { setSeeding(false); }
    };

    return (
        <div>
            <div className="header"><h1 className="page-title">📦 Sincronizar Estoque</h1><p className="page-subtitle">Aplica o catalogo padrao em todas as filiais</p></div>
            <div className="card">
                <div style={{ padding:'1rem', background:'rgba(247,179,43,0.1)', border:'1px solid var(--accent)', borderRadius:'12px', marginBottom:'1.5rem', fontSize:'0.95rem', color:'var(--accent)' }}>
                    ⚠️ Esta acao substitui o estoque atual de todas as filiais pelo catalogo padrao.
                </div>
                <button className="btn btn-primary" style={{ width:'100%', fontSize:'1.1rem', padding:'1.25rem' }} onClick={handleSeed} disabled={seeding}>
                    {seeding ? '⏳ Sincronizando...' : '🚀 Aplicar estoque em todas as filiais'}
                </button>
                {done.length > 0 && (
                    <div style={{ marginTop:'1.5rem' }}>
                        <div style={{ fontWeight:'700', marginBottom:'1rem', color:'var(--success)' }}>✅ Sincronizado com sucesso em:</div>
                        <div style={{ display:'flex', flexWrap:'wrap', gap:'0.5rem' }}>
                            {STORES.filter(s => done.includes(s.id)).map(s => <span key={s.id} className="badge badge-confirmed">{s.name}</span>)}
                        </div>
                    </div>
                )}
            </div>
        </div>
    );
}

try {
    if (window.__FIREBASE_ERROR__) {
        document.getElementById('root').innerHTML =
            '<div style="padding:3rem;font-family:sans-serif;color:#fff;text-align:center;max-width:600px;margin:0 auto;">' +
            '<h2>⚠️ Firebase não conectou</h2><p style="color:#A0AEC0;">' + window.__FIREBASE_ERROR__ + '</p>' +
            '<p style="color:#718096;font-size:0.9rem;margin-top:1rem;">Possíveis causas: sem internet, navegador bloqueando gstatic.com, ou extensão de bloqueio ativa.</p></div>';
    } else {
        ReactDOM.render(<App />, document.getElementById('root'));
    }
} catch (err) {
    document.getElementById('root').innerHTML =
        '<div style="padding:3rem;font-family:sans-serif;color:#fff;text-align:center;">' +
        '<h2>⚠️ Erro ao iniciar o sistema</h2><p>' + err.message + '</p></div>';
    console.error(err);
}
</script>

</body>
